server:
  port: ${PORT:8080}

spring:
  application:
    name: habit-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/habit_tracker}
    username: ${DB_USERNAME:rinamac}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
